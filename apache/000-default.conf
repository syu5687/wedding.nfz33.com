<VirtualHost *:8080>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	
	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>
	
	# === 圧縮設定 (gzip) ===
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
		AddOutputFilterByType DEFLATE application/javascript application/x-javascript application/json
		AddOutputFilterByType DEFLATE application/xml application/xhtml+xml application/rss+xml
		AddOutputFilterByType DEFLATE image/svg+xml
	</IfModule>
	
	# === ブラウザキャッシュ設定 ===
	# 戦略: HTMLは即時反映、CSS/JSはファイル名バージョニング前提でlong-cache
	<IfModule mod_expires.c>
		ExpiresActive On
		ExpiresDefault                          "access plus 1 month"
		# HTML: キャッシュしない（常に最新を取得）
		ExpiresByType text/html                 "access plus 0 seconds"
		# CSS/JS: ?v=YYYYMMDD でバージョニングする想定 → 1週間キャッシュ
		ExpiresByType text/css                  "access plus 7 days"
		ExpiresByType application/javascript    "access plus 7 days"
		# 画像: 長期キャッシュ
		ExpiresByType image/jpeg                "access plus 1 year"
		ExpiresByType image/png                 "access plus 1 year"
		ExpiresByType image/webp                "access plus 1 year"
		ExpiresByType image/svg+xml             "access plus 1 year"
		ExpiresByType image/x-icon              "access plus 1 year"
		ExpiresByType font/woff                 "access plus 1 year"
		ExpiresByType font/woff2                "access plus 1 year"
	</IfModule>
	
	# === Cache-Controlヘッダーの明示的設定 ===
	<IfModule mod_headers.c>
		# HTMLは必ず再検証
		<FilesMatch "\.(html|htm)$">
			Header set Cache-Control "no-cache, no-store, must-revalidate"
			Header set Pragma "no-cache"
			Header set Expires "0"
		</FilesMatch>
		# CSS/JSはバージョニング前提でmust-revalidate
		<FilesMatch "\.(css|js)$">
			Header set Cache-Control "public, max-age=604800, must-revalidate"
		</FilesMatch>
		# 画像/フォントは長期キャッシュ
		<FilesMatch "\.(jpg|jpeg|png|webp|svg|ico|woff|woff2)$">
			Header set Cache-Control "public, max-age=31536000, immutable"
		</FilesMatch>
	</IfModule>
	
	# === リバースプロキシ対応 ===
	# rc-saga.jp/lp/lp1/ 経由で配信されるため X-Forwarded ヘッダーを尊重
	<IfModule mod_remoteip.c>
		RemoteIPHeader X-Forwarded-For
	</IfModule>
	# プロキシ経由のHTTPSを認識
	SetEnvIf X-Forwarded-Proto https HTTPS=on
	
	# === セキュリティヘッダー ===
	<IfModule mod_headers.c>
		Header set X-Content-Type-Options "nosniff"
		Header set X-Frame-Options "SAMEORIGIN"
		Header set Referrer-Policy "strict-origin-when-cross-origin"
		Header set Permissions-Policy "geolocation=(), microphone=(), camera=()"
		# HSTS (HTTPS強制 - リバースプロキシ経由でhttpsアクセスのため)
		Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	</IfModule>
	
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
