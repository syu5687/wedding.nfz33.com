<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memolead Wedding LP Hub｜ランディングページ一覧</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="メモリードグループ ブライダル施設のランディングページ集約サーバ">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Hiragino Mincho Pro','Yu Mincho','Noto Serif JP',serif;
  background:#FAF6EF;
  color:#2A241D;
  min-height:100vh;
  padding:60px 24px;
  line-height:1.7;
}
.container{
  max-width:880px;margin:0 auto;
}
.eyebrow{
  font-family:'Cormorant Garamond',serif;
  font-size:13px;letter-spacing:.3em;
  color:#A88A4F;text-align:center;
  margin-bottom:12px;font-weight:500;
}
h1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(28px,5vw,40px);
  font-weight:500;text-align:center;
  margin-bottom:16px;letter-spacing:.02em;
}
.subtitle{
  text-align:center;font-size:14px;color:#5C544A;
  margin-bottom:48px;
}
.section{margin-bottom:56px}
.section-title{
  font-size:16px;font-weight:600;color:#2A241D;
  padding-bottom:12px;border-bottom:1px solid rgba(168,138,79,.3);
  margin-bottom:24px;display:flex;align-items:center;gap:12px;
}
.section-title::before{
  content:'';display:inline-block;width:24px;height:1px;
  background:#A88A4F;
}
.lp-grid{
  display:grid;grid-template-columns:1fr;gap:16px;
}
@media(min-width:600px){
  .lp-grid{grid-template-columns:1fr 1fr}
}
.lp-card{
  background:#fff;border:1px solid rgba(168,138,79,.2);
  border-radius:6px;padding:20px 22px;
  text-decoration:none;color:#2A241D;
  transition:all .25s;display:block;
}
.lp-card:hover{
  border-color:#A88A4F;
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(42,36,29,.08);
}
.lp-card-id{
  font-family:'Cormorant Garamond',serif;
  font-size:11px;letter-spacing:.2em;color:#A88A4F;
  font-weight:600;
}
.lp-card-title{
  font-size:17px;font-weight:600;margin:6px 0 8px;
  letter-spacing:.02em;
}
.lp-card-desc{font-size:12px;color:#5C544A;line-height:1.6}
.lp-card-arrow{
  display:inline-block;margin-top:14px;font-size:12px;
  color:#A88A4F;font-weight:500;letter-spacing:.05em;
}
.coming-soon{
  background:#F2EBE0;color:#8C7B65;
  border-style:dashed;cursor:default;
  pointer-events:none;
}
.coming-soon:hover{transform:none;box-shadow:none}
.footer{
  text-align:center;font-size:11px;color:#8C7B65;
  letter-spacing:.1em;margin-top:60px;padding-top:24px;
  border-top:1px solid rgba(168,138,79,.15);
}
.footer-en{
  font-family:'Cormorant Garamond',serif;
  letter-spacing:.2em;font-size:10px;
  margin-top:6px;
}
</style>
</head>
<body>
<div class="container">
  <div class="eyebrow">MEMOLEAD WEDDING</div>
  <h1>Landing Page Hub</h1>
  <p class="subtitle">メモリードグループ ブライダル施設 LP集約サーバ</p>

  <!-- ROYAL CHESTER SAGA -->
  <div class="section">
    <h2 class="section-title">ROYAL CHESTER SAGA / ロイヤルチェスター佐賀</h2>
    <div class="lp-grid">
      <a href="/rcs/lp/lp1/" class="lp-card">
        <div class="lp-card-id">RCS / LP01</div>
        <div class="lp-card-title">Le Diaphane キャンペーンLP</div>
        <div class="lp-card-desc">プライベートガーデン貸切ウェディング・39%OFFキャンペーン訴求</div>
        <span class="lp-card-arrow">View →</span>
      </a>
      <div class="lp-card coming-soon">
        <div class="lp-card-id">RCS / LP02</div>
        <div class="lp-card-title">Coming Soon</div>
        <div class="lp-card-desc">追加LP予定</div>
      </div>
    </div>
  </div>

  <!-- 他施設の例 (将来追加) -->
  <!-- 
  <div class="section">
    <h2 class="section-title">ALCAZAR AVVIO / アルカサルアヴィオ</h2>
    <div class="lp-grid">
      <a href="/alcazar/lp/lp1/" class="lp-card">...</a>
    </div>
  </div>
  -->

  <div class="footer">
    Produced by LINK-UP Management
    <div class="footer-en">© Memolead. All rights reserved.</div>
  </div>
</div>
</body>
</html>
